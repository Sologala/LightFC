model_parameters:
  onnx_model: './lightfc_backbone.onnx'
  march: "bayes-e"
  layer_out_dump: False
  working_dir: 'model_output'
  output_model_file_prefix: 'hrnet_siamcc'

input_parameters:
  input_name: ""
  input_type_rt: 'nv12'
  input_type_train: 'rgb'
  input_layout_train: 'NCHW'
  norm_type: 'data_scale'
  scale_value: 0.003921568627451

calibration_parameters:
  cal_data_dir: './data/'
  cal_data_type: 'uint8'
  preprocess_on: False

compiler_parameters:
  compile_mode: 'latency'
  debug: False
  optimize_level: 'O3'
