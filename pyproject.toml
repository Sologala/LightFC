[project]
name = "lightfc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "easydict>=1.13",
    "jpeg4py>=0.1.4",
    "lmdb>=1.7.2",
    "numpy==1.23.3",
    "onnx>=1.18.0",
    "opencv-python",
    "pandas>=2.1.0",
    "pycocotools>=2.0.10",
    "pyyaml>=6.0.2",
    "tensorboardx>=2.6.4",
    "thop>=0.1.1.post2209072238",
    "timm>=1.0.17",
    "torch==1.13",
    "torchvision==0.14.0",
    "visdom>=0.2.4",
    "vot-toolkit",
]

[[tool.uv.index]]
name = "pytorch-cu116"
url = "https://download.pytorch.org/whl/cu116"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu116", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu116", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
vot-toolkit = { git = "https://github.com/votchallenge/vot-toolkit-python" }
